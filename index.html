<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Midnights</title>
  <meta name="description" content="Little games for late nights. Made by Shauna.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://games.shauna.digital/">
  <meta property="og:title" content="Midnights: little games for late nights">
  <meta property="og:description" content="Little games for late nights. Made by Shauna.">
  <meta property="og:image" content="https://games.shauna.digital/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Midnights: little games shown as polaroids clipped to a string of lights on a cork wall at night.">

  <meta name="twitter:title" content="Midnights: little games for late nights">
  <meta name="twitter:description" content="Little games for late nights. Made by Shauna.">
  <meta name="twitter:image" content="https://games.shauna.digital/og.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312968f'/%3E%3Cg transform='rotate%28-6 16 16%29'%3E%3Crect x='8' y='6' width='16' height='20' rx='1.5' fill='%23fbfaf6'/%3E%3Crect x='10' y='8' width='12' height='12' fill='%2306433f'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preload" href="fonts/syne-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/neonderthaw-400.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Self-hosted font subsets: each file holds only the characters the page shows. Rebuild with tools/subset-fonts.py after changing any visible text. */
    @font-face { font-family: 'Syne'; font-style: normal; font-weight: 800; font-display: swap; src: url(fonts/syne-800.woff2) format('woff2'); }
    @font-face { font-family: 'Neonderthaw'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/neonderthaw-400.woff2) format('woff2'); }
    @font-face { font-family: 'Figtree'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/figtree-400.woff2) format('woff2'); }
    :root {
      /* Colors and fonts. The page background is Shauna's cork wall (see .bg below). One look in light and dark mode. */
      --teal: #12968f; --teal-glow: #3fd9c8; --teal-deep: #06433f;
      --ink: #eef7f2; --muted: #b9dcd5; --accent: #ffe7a8;
      --title: 'Syne', 'Arial Black', system-ui, sans-serif;
      --body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
      --photo-paper: #fbfaf6; --photo-ink: #2a2433; --photo-muted: #6b6474;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #170905;
      min-height: 100vh; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
      padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(20px, env(safe-area-inset-left, 0px));
    }
    main { max-width: 880px; margin: 0 auto; padding-block: 56px 72px; display: flex; flex-direction: column; gap: 40px; }
    h1 { font: 800 clamp(2.6rem, 10vw, 4.6rem)/1 var(--title); margin: 0; letter-spacing: -0.01em; color: var(--ink); text-shadow: 0 2px 18px rgba(2, 40, 37, .45); }
    /* Neon sign: white-hot tube with layered pink glow and an occasional flicker. */
    .tagline { margin: 6px 0 0 6px; font: 400 clamp(1.9rem, 6vw, 2.4rem)/1.1 'Neonderthaw', 'Brush Script MT', cursive; color: #fff4fb;
      text-shadow: 0 0 2px #fff, 0 0 6px #ff9fd2, 0 0 12px #ff4fa8, 0 0 22px #ff2d95, 0 0 38px #e0177d, 0 0 60px rgba(224, 23, 125, .55);
      animation: neon-flicker 5s infinite; }
    .tagline .tube { animation: neon-buzz 3.3s infinite; }
    @keyframes neon-flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
      20%, 24% { opacity: .25; text-shadow: none; }
      55% { opacity: .6; text-shadow: 0 0 2px #fff, 0 0 8px #ff4fa8; }
    }
    @keyframes neon-buzz {
      0%, 40%, 44%, 47%, 100% { opacity: 1; }
      42%, 46% { opacity: .15; text-shadow: none; }
      45% { opacity: .7; }
    }
    @media (prefers-reduced-motion: reduce) { .tagline, .tagline .tube { animation: none; } }
    /* The wall (Shauna, 2026-10-17): polaroids clipped to strings of lights on her cork wall at night.
       Wide screens: 4 cards on one string. Medium: 2 rows of 2. Phones (under 700px): one clothesline you swipe, with dots below.
       The strings, bulbs and clips are drawn by the script at the end. The bulbs near a hovered or centered card glow in that game's color. */
    .line { position: relative; }
    .lights { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 0; }
    .bulb { animation: twinkle var(--tw, 4s) ease-in-out var(--td, 0s) infinite alternate; }
    .bulb .glass, .bulb .halo { fill: var(--c); transition: fill .5s ease; }
    .bulb .halo { opacity: .45; }
    @keyframes twinkle { from { opacity: .72; } to { opacity: 1; } }
    .games { display: grid; grid-template-columns: repeat(2, minmax(0, 300px)); justify-content: center; gap: 56px 56px; list-style: none; margin: 0; padding: 0; position: relative; z-index: 1; }
    .games > li { width: 100%; padding-top: 34px; }
    @media (min-width: 1060px) {
      main { max-width: 1120px; }
      .games { grid-template-columns: repeat(4, minmax(0, 260px)); gap: 56px 40px; }
    }
    /* Polaroid cards: white frame with a deep blank bottom margin, no caption (Shauna, 2026-10-16). The whole card is the link. Newest game first.
       Each hangs from a wooden clip, swings a little on hover, and swings before the game opens on a tap. */
    .card { position: relative; display: flex; flex-direction: column; background: var(--photo-paper); color: var(--photo-ink); text-decoration: none; padding: 14px 14px 52px; border-radius: 3px; height: 100%;
      transform-origin: 50% -20px; box-shadow: 0 1px 2px rgba(10, 3, 2, .4), 0 14px 30px rgba(10, 3, 2, .5); transition: box-shadow .18s ease; }
    .card::before { content: ""; position: absolute; left: 50%; top: -22px; width: 12px; height: 36px; margin-left: -6px; border-radius: 3px; z-index: 2;
      background: linear-gradient(90deg, #d9ad75 0 44%, #8a5a2f 44% 56%, #c99a62 56%); box-shadow: 0 2px 3px rgba(10, 3, 2, .45); }
    .card::after { content: ""; position: absolute; left: 50%; top: -9px; width: 16px; height: 4px; margin-left: -8px; border-radius: 2px; z-index: 3;
      background: linear-gradient(#e2e2e2, #8d8d8d); }
    a.card:hover, a.card:focus-visible { box-shadow: 0 2px 4px rgba(10, 3, 2, .4), 0 22px 44px rgba(10, 3, 2, .55); }
    .card.swing { animation: swing .9s ease-out; }
    @keyframes swing { 0% { transform: rotate(0); } 25% { transform: rotate(2.4deg); } 55% { transform: rotate(-1.6deg); } 80% { transform: rotate(.7deg); } 100% { transform: rotate(0); } }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
    .art { aspect-ratio: 1 / 1; display: grid; place-items: center; position: relative; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06);
      background:
        radial-gradient(60% 80% at 88% 8%, rgba(255, 244, 190, .85), transparent 70%),
        linear-gradient(135deg, #ff9ec7 0%, #f8b9e2 32%, #c8b6f6 62%, #9fd3ff 100%); }
    .sticker { position: absolute; top: -14px; right: -14px; z-index: 4; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
      background: #e0177d; color: #ffffff; font: 800 .78rem/1 var(--title); letter-spacing: .06em; text-transform: uppercase;
      transform: rotate(12deg); box-shadow: 0 4px 10px rgba(2, 30, 28, .35); }
    /* Each card photo is the game's own logo over its own background, 600 by 600 (Shauna's art, 2026-10-16 and 2026-10-17). */
    .art-tropi { background: #f2a36b url(img/tropichop-card.webp) center / cover no-repeat; }
    .art-salt { background: #e9955a url(img/saltwhisker-card.webp) center / cover no-repeat; }
    .art-night { background: #1b1838 url(img/homebeforedark-card.webp) center / cover no-repeat; }
    .art-beads { background: #3a1830 url(img/13-beads-card.webp) center / cover no-repeat; }
    /* The next game: an instant photo still developing, a slow fog that brightens and fades. */
    .art-dev { overflow: hidden; background:
        radial-gradient(55% 45% at 40% 38%, rgba(214, 206, 186, .75), transparent 70%),
        radial-gradient(60% 50% at 72% 78%, rgba(150, 160, 140, .5), transparent 70%),
        linear-gradient(160deg, #6f6a5e, #3f3c36 75%); }
    .art-dev::after { content: ""; position: absolute; inset: 0; background: radial-gradient(45% 40% at 55% 50%, rgba(236, 230, 214, .55), transparent 70%); animation: develop 7s ease-in-out infinite alternate; }
    @keyframes develop { from { opacity: .25; } to { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) { .art-dev::after { animation: none; opacity: .5; } }
    /* Footer sits on a soft dark band so the light text clears 4.5:1 over any part of the background. */
    footer { font-size: .95rem; }
    footer p { display: inline-block; margin: 0; padding: 9px 16px; border-radius: 18px; color: var(--ink); background: rgba(8, 4, 16, .78); }
    footer a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    footer a:hover, footer a:focus-visible { color: var(--accent); }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
    /* Phones: one clothesline you swipe sideways, a card snaps to the middle, dots below show which one. */
    .dots { display: none; }
    @media (max-width: 699px) {
      main { gap: 28px; }
      .line { margin-inline: calc(-1 * max(20px, env(safe-area-inset-left, 0px))); overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; padding-bottom: 30px; }
      .line::-webkit-scrollbar { display: none; }
      .games { display: flex; width: max-content; gap: 24px; padding-inline: calc(50vw - min(38vw, 170px)); }
      .games > li { width: min(76vw, 340px); flex: none; scroll-snap-align: center; }
      .dots { display: flex; justify-content: center; gap: 4px; margin-top: -26px; }
      .dots button { width: 30px; height: 30px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
      .dots button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 213, 138, .35); transition: background .3s ease, transform .3s ease; }
      .dots button[aria-current="true"]::before { background: var(--c, #ffd58a); transform: scale(1.35); box-shadow: 0 0 10px var(--c, #ffd58a); }
      .dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 50%; }
    }
    @media (prefers-reduced-motion: reduce) { .bulb, .card.swing { animation: none; } .dots button::before { transition: none; } }
    /* Background: Shauna's cork wall at night (2026-10-17), lit warm from the top, with a faint plum shade toward the bottom. */
    .bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: #170905 url(img/wall.webp) center top / cover no-repeat; }
    .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(24, 6, 22, .45)); }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main>
    <header>
      <h1>Midnights</h1>
      <p class="tagline">Little games for late <span class="tube">nights.</span></p>
    </header>
    <div class="line">
      <ul class="games">
        <li>
          <a class="card" href="/tropichop/" aria-label="TropiChop, new game">
            <span class="sticker" aria-hidden="true">New</span>
            <div class="art art-tropi" aria-hidden="true"></div>
          </a>
        </li>
        <li>
          <a class="card" href="/saltwhisker/" aria-label="Saltwhisker">
            <div class="art art-salt" aria-hidden="true"></div>
          </a>
        </li>
        <li>
          <a class="card" href="/homebeforedark/" aria-label="Home Before Dark">
            <div class="art art-night" aria-hidden="true"></div>
          </a>
        </li>
        <li>
          <a class="card" href="/13-beads/" aria-label="13 Beads">
            <div class="art art-beads" aria-hidden="true"></div>
          </a>
        </li>
        <!-- Hidden 2026-10-11 (Shauna). Restore this card to tease the next game.
        <li class="soon">
          <div class="card" role="img" aria-label="Another game, still developing">
            <div class="art art-dev" aria-hidden="true"></div>
          </div>
        </li>
        -->
      </ul>
    </div>
    <div class="dots" role="group" aria-label="Choose a game"></div>
    <footer><p><a href="https://shauna.dev">Made by Shauna.</a> By day I build software for growing businesses at <a href="https://shauna.digital">shauna.digital</a>.</p></footer>
  </main>
  <script>
  (() => {
    // Strings of lights between the card clips, one string per row, redrawn whenever the layout changes.
    const NS = 'http://www.w3.org/2000/svg';
    const line = document.querySelector('.line'), ul = line.querySelector('.games'), dots = document.querySelector('.dots');
    const cards = [...ul.querySelectorAll('a.card')];
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const phone = matchMedia('(max-width: 699px)');
    const TINT = { tropichop: '#ff9a1a', saltwhisker: '#ffcf3a', homebeforedark: '#e6493a', '13-beads': '#ff5fae' };
    const WARM = ['#ffd58a', '#ffc56b', '#ffe2a8'];
    const keyOf = (a) => { const m = (a.getAttribute('href') || '').match(/[\w-]+/); return m ? m[0] : null; };
    const svg = document.createElementNS(NS, 'svg'); svg.classList.add('lights'); svg.setAttribute('aria-hidden', 'true'); line.prepend(svg);
    const el = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); parent.appendChild(e); return e; };
    let bulbs = [], tint = null, active = null;
    function layout() {
      svg.textContent = ''; bulbs = [];
      const f = el('filter', { id: 'glow', x: '-100%', y: '-100%', width: '300%', height: '300%' }, el('defs', {}, svg));
      el('feGaussianBlur', { stdDeviation: 7 }, f);
      const W = phone.matches ? ul.scrollWidth : line.clientWidth, H = ul.offsetHeight;
      svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const rows = new Map();
      for (const a of cards) { const li = a.parentElement; const y = li.offsetTop + 14; const p = { x: li.offsetLeft + li.offsetWidth / 2, y, k: keyOf(a) }; (rows.get(y) || rows.set(y, []).get(y)).push(p); }
      let n = 0;
      for (const [y, pts] of rows) {
        pts.sort((a, b) => a.x - b.x);
        const ends = phone.matches ? [0, W] : [-28, W + 28];
        const anchors = [{ x: ends[0], y: y - 18 }, ...pts, { x: ends[1], y: y - 18 }];
        let d = `M${anchors[0].x} ${anchors[0].y}`;
        const segs = [];
        for (let i = 1; i < anchors.length; i++) {
          const A = anchors[i - 1], B = anchors[i], dist = B.x - A.x, sag = Math.min(16, dist * .06);
          const C = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 + 2 * sag };
          d += ` Q${C.x} ${C.y} ${B.x} ${B.y}`; segs.push([A, C, B, dist]);
        }
        el('path', { d, fill: 'none', stroke: '#1c130e', 'stroke-width': 2, 'stroke-linecap': 'round' }, svg);
        for (const [A, C, B, dist] of segs) {
          const count = Math.max(1, Math.round(dist / 62));
          for (let i = 0; i < count; i++) {
            const u = (i + .5) / count, v = 1 - u;
            const x = v * v * A.x + 2 * u * v * C.x + u * u * B.x, by = v * v * A.y + 2 * u * v * C.y + u * u * B.y;
            if (x < 6 || x > W - 6 || pts.some((p) => Math.abs(p.x - x) < 22)) continue;
            const owner = pts.reduce((m, p) => (Math.abs(p.x - x) < Math.abs(m.x - x) ? p : m), pts[0]);
            const g = el('g', { class: 'bulb', transform: `translate(${x.toFixed(1)} ${by.toFixed(1)}) rotate(${180 + ((n * 37) % 31) - 15})` }, svg);
            g.style.setProperty('--tw', `${3 + (n * 7) % 4}s`); g.style.setProperty('--td', `${-((n * 13) % 50) / 10}s`);
            el('circle', { class: 'halo', cx: 0, cy: 14, r: 13, filter: 'url(#glow)' }, g);
            el('rect', { x: -3.5, y: 0, width: 7, height: 6, rx: 1, fill: '#2b211b' }, g);
            el('ellipse', { class: 'glass', cx: 0, cy: 14, rx: 5.5, ry: 9 }, g);
            el('ellipse', { cx: -2, cy: 17, rx: 1.4, ry: 3, fill: '#fff', opacity: .55 }, g);
            bulbs.push({ g, k: owner.k, warm: WARM[n % WARM.length] }); n++;
          }
        }
      }
      paint();
    }
    function paint() {
      for (const b of bulbs) b.g.style.setProperty('--c', tint && b.k === tint ? TINT[tint] : b.warm);
      dots.querySelectorAll('button').forEach((d) => { const on = d.dataset.k === active; d.setAttribute('aria-current', on); d.style.setProperty('--c', TINT[d.dataset.k]); });
    }
    const setTint = (k) => { if (tint !== k) { tint = k; paint(); } };
    function swing(a) { if (reduce) return; a.classList.remove('swing'); void a.offsetWidth; a.classList.add('swing'); }
    cards.forEach((a) => {
      a.addEventListener('animationend', () => a.classList.remove('swing'));
      a.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { setTint(keyOf(a)); swing(a); } });
      a.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && !phone.matches) setTint(null); });
      a.addEventListener('focus', () => setTint(keyOf(a)));
      a.addEventListener('blur', () => { if (!phone.matches) setTint(null); });
      a.addEventListener('click', (e) => {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (phone.matches && keyOf(a) !== active) { e.preventDefault(); center(a); return; }
        if (reduce) return;
        e.preventDefault(); swing(a); setTimeout(() => { location.href = a.href; }, 320);
      });
      const b = document.createElement('button'); b.type = 'button'; b.dataset.k = keyOf(a); b.setAttribute('aria-label', a.getAttribute('aria-label').replace(/, new game$/, ''));
      b.addEventListener('click', () => center(a)); dots.appendChild(b);
    });
    function center(a) { const li = a.parentElement; line.scrollTo({ left: li.offsetLeft + li.offsetWidth / 2 - line.clientWidth / 2, behavior: reduce ? 'auto' : 'smooth' }); }
    function pick() {
      if (!phone.matches) { active = null; return; }
      const mid = line.scrollLeft + line.clientWidth / 2;
      let best = cards[0], bd = 1e9;
      for (const a of cards) { const li = a.parentElement, d = Math.abs(li.offsetLeft + li.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = a; } }
      active = keyOf(best); setTint(active); paint();
    }
    line.addEventListener('scroll', pick, { passive: true });
    phone.addEventListener('change', () => { setTint(null); layout(); pick(); });
    new ResizeObserver(() => { layout(); pick(); }).observe(line);
    layout(); pick();
  })();
  </script>
</body>
</html>
